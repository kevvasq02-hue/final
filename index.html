<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- HTML opens the exhibition eight seconds after this page finishes loading. -->
  <meta http-equiv="refresh" content="8; url=exhibit.html">
  <link rel="stylesheet" href="style.css">
  <title>Entering · Unfinished / In Progress</title>
</head>
<body class="entrance-page">
  <main class="entrance">
    <div class="entrance-title">
      <h1><span class="unfinished-word"><span class="flow-word">Unfinished</span></span> <span class="sr-only">/</span><em class="script"><span class="flow-word">In</span> <span class="flow-word">Progress</span></em></h1>
    </div>

    <div class="entrance-status">
      <div class="meter" style="--stop: 100; --time: none ">
        <p class="meter-label"><span><span class="flow-word">Opening</span> <span class="flow-word">exhibition</span></span> <span class="number flow-word" aria-hidden="true"></span></p>
        <div class="track" aria-hidden="true"><span></span></div>
      </div>
      <p class="sr-only">The exhibition opens automatically. You can also enter now.</p>
      <a class="quiet-link" href="exhibit.html"><span><span class="flow-word">Enter</span> <span class="flow-word">now</span></span></a>
    </div>
  </main>
</body>
</html>
