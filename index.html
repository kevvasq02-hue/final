<!doctype html>
<html lang="en" class="gallery-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <title>Exhibition · Unfinished / In Progress</title>
</head>
<body>
  <header class="site-bar page-width">
    <span class="artist-name">Kevin Vasquez</span>
    <nav aria-label="Exhibition">
      <a href="#selected">Selected work <span aria-hidden="true">↓</span></a>
    </nav>
  </header>

  <main>
    <section class="gallery-intro page-width" aria-labelledby="show-title">
      <div>
        <h1 id="show-title" class="exhibit-title">
          Unfinished<span class="sr-only"> / </span>
          <em class="script">In Progress</em>
        </h1>
        <p class="intro-line">Paintings between one sitting and the next.</p>
      </div>
      <!-- A bookplate made with CSS, like a small mark printed on a gallery invitation. -->
      <div class="bookplate" aria-hidden="true">
        <span class="plate-initials script">K<span>V</span></span>
        <span class="plate-flower">❦</span>
      </div>
    </section>

    <section id="selected" class="selected-work" aria-labelledby="work-title">
      <div class="page-width">
        <p class="eyebrow">Selected work</p>
        <!-- The first span always reserves the correct width and is read aloud once.
             The second span is the moving layer. Keep both versions of the words in sync. -->
        <h2 id="work-title" class="gather">
          <span class="typeset">Portrait study</span>
          <span class="loose-type" aria-hidden="true"><span class="word"><i>P</i><i>o</i><i>r</i><i>t</i><i>r</i><i>a</i><i>i</i><i>t</i></span> <span class="word"><i>s</i><i>t</i><i>u</i><i>d</i><i>y</i></span></span>
        </h2>
        <div class="work-entry">
          <p>Painting in progress</p>
          <a class="action" href="portrait.html">Open work <span aria-hidden="true">↗</span></a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
