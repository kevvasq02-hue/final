<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- HTML opens the exhibition three seconds after this page finishes loading. -->
  <meta http-equiv="refresh" content="3; url=exhibit.html">
  <link rel="stylesheet" href="style.css">
  <title>Entering · Unfinished / In Progress</title>
</head>
<body class="entrance-page">
  <main class="entrance">
    <div class="entrance-title">
      <span class="fleuron" aria-hidden="true">❦</span>
      <h1><span class="unfinished-word">Unfinished</span><span class="sr-only"> / </span> <em class="script">In Progress</em></h1>
    </div>

    <div class="entrance-status">
      <div class="meter" style="--stop: 100; --time: 10s">
        <p class="meter-label">Opening exhibition <span class="number" aria-hidden="true"></span></p>
        <div class="track" aria-hidden="true"><span></span></div>
      </div>
      <p class="sr-only">The exhibition opens automatically. You can also enter now.</p>
      <a class="quiet-link" href="exhibit.html">Enter now <span aria-hidden="true">→</span></a>
    </div>
  </main>
</body>
</html>
