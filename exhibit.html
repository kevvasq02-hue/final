<!doctype html>
<html lang="en" class="gallery-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
  <title>Exhibition · Unfinished / In Progress</title>
</head>
<body>
  <header class="site-bar page-width">
    <span class="header-ornament" aria-hidden="true"><i></i><i></i><i></i></span>
    
    <nav aria-label="Exhibition">
      <a class="selected-type" href="#selected"><span><span class="flow-word">Selected</span> <span class="flow-word">work</span></span></a>
    </nav>
  </header>

  <main>
    <section class="gallery-intro page-width" aria-labelledby="show-title">
      <div>
        <h1 id="show-title" class="exhibit-title">
          <span class="unfinished-word"><span class="flow-word">Unfinished</span></span><span class="sr-only"> / </span>
          <em class="script"><span class="flow-word">In</span> <span class="flow-word">Progress</span></em>
        </h1>
      </div>

      <figure class="artist-portrait">
        <div class="drawing-window">
          <img src="images/self-portrait.png" width="1536" height="2048"
               alt="Kevin Vasquez drawn standing with both hands covering his face.">
        </div>
        <figcaption>
          <span class="plate-initials script" role="img" aria-label="KV, Kevin Vasquez">K<span>V</span></span>
        </figcaption>
      </figure>
    </section>

    <section id="selected" class="selected-work scroll-words" aria-labelledby="work-title">
      <div class="page-width">
        <p class="eyebrow selected-type"><span class="flow-word">Selected</span> <span class="flow-word">work</span></p>
        <h2 id="work-title" class="gather"><span class="flow-word">Portrait</span> <span class="flow-word">study</span></h2>
        <div class="work-entry">
          <p><span class="flow-word">Painting</span> <span class="flow-word">in</span> <span class="flow-word">progress</span></p>
          <a class="open-work" href="portrait.html"><span><span class="flow-word">Open</span> <span class="flow-word">work</span></span></a>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
